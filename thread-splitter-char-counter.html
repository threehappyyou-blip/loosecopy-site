<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loosecopy — Char Counter + Thread Splitter (drop-in widget)</title>
<style>
  :root{
    --lc-bg:#fafaf8; --lc-surface:#ffffff; --lc-ink:#16181d; --lc-muted:#5b6270;
    --lc-border:#e6e4de; --lc-accent:#e8622c; --lc-accent-soft:#fdeee6;
    --lc-radius:14px; --lc-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    --lc-ok:#1f8a4c; --lc-warn:#c8501a; --lc-over:#c62828;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--lc-bg);color:var(--lc-ink);font-family:var(--lc-font);line-height:1.6;padding:40px 20px 80px;}
  .wrap{max-width:720px;margin:0 auto;}
  .demo-frame{max-width:900px;margin:0 auto 24px;padding:10px 16px;background:#fff3ea;border:1px dashed var(--lc-accent);border-radius:10px;font-size:13px;color:#8a4523;}
  h1{font-size:24px;margin:0 0 6px;}
  .sub{color:var(--lc-muted);font-size:14.5px;margin:0 0 24px;}
  textarea{
    width:100%;min-height:160px;padding:16px;border:1px solid var(--lc-border);border-radius:var(--lc-radius);
    font-family:var(--lc-font);font-size:15px;line-height:1.6;color:var(--lc-ink);background:var(--lc-surface);resize:vertical;
  }
  textarea:focus{outline:2px solid var(--lc-accent);outline-offset:1px;}

  .counters{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
  .counter{
    padding:8px 14px;border-radius:999px;border:1px solid var(--lc-border);background:var(--lc-surface);
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
  }
  .counter .dot{width:7px;height:7px;border-radius:50%;background:var(--lc-ok);}
  .counter.warn .dot{background:var(--lc-warn);}
  .counter.over .dot{background:var(--lc-over);}
  .counter.over{color:var(--lc-over);border-color:var(--lc-over);}

  .row{margin-top:18px;}
  button{
    background:var(--lc-accent);color:#fff;border:none;border-radius:10px;padding:11px 20px;
    font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--lc-font);
  }
  button.secondary{background:var(--lc-surface);color:var(--lc-ink);border:1px solid var(--lc-border);}
  button:hover{filter:brightness(0.96);}

  .thread{margin-top:22px;display:none;flex-direction:column;gap:10px;}
  .tweet{
    background:var(--lc-surface);border:1px solid var(--lc-border);border-radius:12px;padding:14px 16px;
    display:flex;justify-content:space-between;gap:12px;align-items:flex-start;font-size:14.5px;white-space:pre-wrap;
  }
  .tweet .len{color:var(--lc-muted);font-size:12px;white-space:nowrap;}
  .copy-mini{
    background:none;border:1px solid var(--lc-border);border-radius:8px;padding:4px 10px;font-size:12px;
    cursor:pointer;color:var(--lc-ink);flex:none;
  }
</style>
</head>
<body>
<div class="demo-frame">
  이 페이지는 데모/참고용입니다. 실제로는 아래 &lt;script&gt; 안의 <code>LIMITS</code>, <code>splitIntoTweets()</code>,
  <code>updateCounters()</code> 로직을 app.html의 결과 검토 textarea에 그대로 붙이면 됩니다.
  (기존 "검토·수정 완료" 체크박스 게이트와 함께 두면 자연스럽게 어울려요.)
</div>

<div class="wrap">
  <h1>Check your length, then split if needed</h1>
  <p class="sub">Edit your draft below — we'll show you where it stands per platform.</p>

  <textarea id="draft" placeholder="Your draft goes here...">Paste or write your post here. As you type, the counters below update for each platform so you know exactly where you stand before you copy anything out.</textarea>

  <div class="counters" id="counters"></div>

  <div class="row">
    <button id="splitBtn">Split into Twitter/X thread</button>
    <button class="secondary" id="copyAllBtn" style="display:none;margin-left:10px;">Copy all tweets</button>
  </div>

  <div class="thread" id="thread"></div>
</div>

<script>
(function(){
  // 플랫폼별 글자 제한 — 필요하면 자유롭게 추가/수정하세요
  const LIMITS = [
    {name:"Twitter/X", limit:280},
    {name:"LinkedIn", limit:3000},
    {name:"Threads", limit:500},
    {name:"Instagram caption", limit:2200},
  ];

  const draft = document.getElementById("draft");
  const countersEl = document.getElementById("counters");
  const splitBtn = document.getElementById("splitBtn");
  const copyAllBtn = document.getElementById("copyAllBtn");
  const threadEl = document.getElementById("thread");

  function updateCounters(){
    const len = draft.value.length;
    countersEl.innerHTML = LIMITS.map(p => {
      const ratio = len / p.limit;
      const cls = ratio > 1 ? "over" : ratio > 0.9 ? "warn" : "";
      return `<span class="counter ${cls}"><span class="dot"></span>${p.name}: ${len}/${p.limit}</span>`;
    }).join("");
  }

  // 280자 기준으로 문단을 자연스럽게 분할 + "(i/N)" 번호 매기기.
  // reserve는 " (i/N)" 라벨용 여유 공간 (2자리 번호까지 안전하게 커버).
  function splitIntoTweets(text, limit = 280, reserve = 9){
    const words = text.split(/\s+/).filter(Boolean);
    const budget = limit - reserve;
    const chunks = [];
    let current = "";

    for (const word of words){
      const candidate = current ? current + " " + word : word;
      if (candidate.length > budget){
        if (current) chunks.push(current);
        if (word.length > budget){
          // 단어 하나가 너무 긴 경우(예: 긴 URL) — 강제 분할
          let w = word;
          while (w.length > budget){
            chunks.push(w.slice(0, budget));
            w = w.slice(budget);
          }
          current = w;
        } else {
          current = word;
        }
      } else {
        current = candidate;
      }
    }
    if (current) chunks.push(current);

    const N = chunks.length;
    return chunks.map((c, i) => `${c} (${i + 1}/${N})`);
  }

  function renderThread(tweets){
    threadEl.style.display = "flex";
    copyAllBtn.style.display = "inline-block";
    threadEl.innerHTML = tweets.map((t, i) => `
      <div class="tweet">
        <div>${t.replace(/</g,"&lt;")}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="len">${t.length}/280</span>
          <button class="copy-mini" data-idx="${i}">Copy</button>
        </div>
      </div>`).join("");

    threadEl.querySelectorAll(".copy-mini").forEach(btn => {
      btn.addEventListener("click", () => {
        navigator.clipboard.writeText(tweets[+btn.dataset.idx]);
        btn.textContent = "Copied";
        setTimeout(() => btn.textContent = "Copy", 1200);
      });
    });

    copyAllBtn.onclick = () => {
      navigator.clipboard.writeText(tweets.join("\n\n"));
      copyAllBtn.textContent = "Copied all!";
      setTimeout(() => copyAllBtn.textContent = "Copy all tweets", 1200);
    };
  }

  draft.addEventListener("input", updateCounters);
  splitBtn.addEventListener("click", () => renderThread(splitIntoTweets(draft.value)));

  updateCounters();
})();
</script>
</body>
</html>
